services:
  app:
    build: .
    ports: ["3000:3000"]
    environment:
      PORT: 3000
      OIDC_ISSUER: ${OIDC_ISSUER:?Set OIDC_ISSUER}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:?Set OIDC_CLIENT_ID}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:?Set OIDC_CLIENT_SECRET}
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET}
      OIDC_REDIRECT_URI: ${OIDC_REDIRECT_URI:-http://localhost:3000/oidc/callback}
      TRANSCRIBER: whisper.cpp
      WHISPER_URL: http://whisper:8080/inference
    depends_on: [whisper]
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
  whisper:
    image: ghcr.io/ggml-org/whisper.cpp:main
    command:
      [
        "server",
        "--host",
        "0.0.0.0",
        "--port",
        "8080",
        "--model",
        "/models/ggml-base.en.bin",
      ]
    volumes: ["./models:/models:ro"]
    expose: ["8080"]
